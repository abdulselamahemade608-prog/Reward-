<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Rewards</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js" async></script>
<style>
:root{--bg:#0b1020;--card:#141a2e;--card2:#1b2340;--line:#262f4d;--tx:#eef1fb;--mut:#8b94b8;
--a:#7c5cff;--b:#22d3ee;--gold:#fbbf24;--ok:#34d399;--bad:#fb7185;--grad:linear-gradient(135deg,#7c5cff,#22d3ee)}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 400px at 50% -10%,#1d2450 0,var(--bg) 70%) no-repeat,var(--bg);color:var(--tx);
font:15px/1.45 system-ui,-apple-system,"Noto Sans Ethiopic",sans-serif;padding-bottom:90px;min-height:100vh}
main{padding:16px;max-width:560px;margin:auto}
h2{font-size:17px;margin:20px 0 10px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:var(--grad);color:#fff;
cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.alt{background:var(--card2);border:1px solid var(--line);color:var(--tx)}
.btn.sm{width:auto;padding:8px 14px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}.mut{color:var(--mut);font-size:13px}
.big{font-size:32px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.av{width:40px;height:40px;border-radius:50%;background:var(--card2);object-fit:cover;flex:none;border:2px solid var(--line)}
.av.l{width:76px;height:76px;border-color:var(--a)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:flex;gap:12px;align-items:center}
.stat .ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--card2);color:var(--b)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:4px;background:rgba(20,26,46,.92);backdrop-filter:blur(10px);
border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:12px;padding:6px 0;border-radius:12px;
display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:#fff;background:var(--card2)}
nav button.on .ic{stroke:var(--b)}
table{width:100%;border-collapse:collapse}
td,th{padding:9px 4px;text-align:left;font-size:13px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500}
td.n,th.n{text-align:right}
td .av{width:30px;height:30px}
.rk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-weight:700;font-size:12px;background:var(--card2)}
.rk.r1{background:#fbbf24;color:#3a2a00}.rk.r2{background:#cbd5e1;color:#1e293b}.rk.r3{background:#e0a070;color:#3a1f0a}
input{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 8px;font-size:14px}
input:focus{outline:2px solid var(--a);border-color:transparent}
.tag{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600}
.tag.v{background:#0f3a2c;color:var(--ok)}.tag.nv{background:#44202a;color:var(--bad)}
.prize{display:flex;gap:12px;align-items:center;padding:9px 0}
.prize+.prize{border-top:1px solid var(--line)}
.prize .rk{width:34px;height:34px;font-size:15px}
.scroll{overflow-x:auto}
.center{text-align:center;margin-top:35vh}
</style>
</head>
<body>
<main id="app"><p class="mut center">Loading...</p></main>
<nav id="nav" hidden></nav>

<script>
const I = {
  tv:'<path d="M5 3l14 9-14 9z"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3-5.5 6.5-5.5s6 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14.8c2 .6 3.2 2.4 3.5 5.2"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c.6-4.2 3.8-6.5 8-6.5s7.4 2.3 8 6.5"/>',
  cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM7 6H4v1a3 3 0 003 3M17 6h3v1a3 3 0 01-3 3"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/>',
  share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.6l6.8-4M8.6 13.4l6.8 4"/>',
  check:'<path d="M4 12.5l5 5L20 6.5"/>',
  chan:'<path d="M3 11l16-6v14L3 13z"/><path d="M7 13v5a2 2 0 002 2h1"/>',
  eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'
};
const ic = k => `<svg class="ic" viewBox="0 0 24 24">${I[k]}</svg>`;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tg = window.Telegram && window.Telegram.WebApp;
let D = null, tab = 'ads';

const api = (p, method = 'GET', body) => fetch('/api/' + p, {
  method, headers: {'x-init': tg.initData, 'content-type': 'application/json'},
  body: body ? JSON.stringify(body) : undefined
}).then(r => r.json());
const av = (u, c = 'av') => u.photo ? `<img class="${c}" src="${esc(u.photo)}" alt="">` : `<div class="${c}"></div>`;
const notify = m => tg.showAlert ? tg.showAlert(m) : alert(m);

function onlyTelegram() {
  $('#app').innerHTML = '<p class="mut center">Please open this app from Telegram.</p>';
}

async function load() {
  D = await api('me');
  if (!D || D.error) return onlyTelegram();
  if (D.missing.length) return gate();
  $('#nav').hidden = false;
  const items = [['ads','tv','Ads'],['invite','users','Invite'],['profile','user','Profile']];
  if (D.isAdmin) items.push(['admin','cog','Admin']);
  $('#nav').innerHTML = items.map(([k,i,l]) => `<button data-t="${k}" class="${tab===k?'on':''}">${ic(i)}${l}</button>`).join('');
  $('#nav').onclick = e => { const b = e.target.closest('button'); if (b) { tab = b.dataset.t; load(); } };
  ({ads, invite, profile, admin})[tab]();
}

/* channel gate: only channels the user has not joined */
function gate() {
  $('#nav').hidden = true;
  $('#app').innerHTML = `<h2>Join to continue</h2><p class="mut" style="margin-bottom:14px">Join the channels below, then tap Joined.</p>
  ${D.missing.map(c => `<div class="card row"><span style="color:var(--b)">${ic('chan')}</span><b class="sp">${esc(c.title)}</b>
  <button class="btn sm" onclick="tg.openTelegramLink('${esc(c.url)}')">Join</button></div>`).join('')}
  <button class="btn" onclick="load()">${ic('check')}Joined</button>`;
}

function ads() {
  $('#app').innerHTML = `<h2>Watch ads</h2>
  <div class="card stat"><div class="ib">${ic('eye')}</div><div><div class="mut">Ads watched</div><div class="big">${D.me.ads}</div></div></div>
  <button class="btn" id="w">${ic('tv')}Watch ad</button><p class="mut" id="msg" style="margin-top:10px"></p>`;
  $('#w').onclick = async () => {
    const b = $('#w'); b.disabled = true;
    try {
      const ctl = window.Adsgram.init({blockId: D.settings.adsgram_block});
      await ctl.show();
      $('#msg').textContent = 'Counting your ad...';
      setTimeout(load, 2500);
    } catch (e) { $('#msg').textContent = 'No ad available right now. Try again soon.'; b.disabled = false; }
  };
}

async function invite() {
  const lb = await api('leaderboard'), s = D.settings;
  const prizes = [['r1','1st place',s.reward1],['r2','2nd place',s.reward2],['r3','3rd place',s.reward3]];
  $('#app').innerHTML = `<h2>Invite friends</h2>
  <div class="card stat"><div class="ib">${ic('users')}</div><div><div class="mut">Your invites</div><div class="big">${D.me.invites}</div></div></div>
  <div class="grid"><button class="btn" id="sh">${ic('share')}Share</button><button class="btn alt" id="cp">${ic('copy')}Copy link</button></div>
  <h2>Prizes</h2><div class="card">${prizes.map((p,i) => `<div class="prize"><span class="rk ${p[0]}">${i+1}</span>
  <div><div class="mut">${p[1]}</div><b>${esc(p[2])}</b></div></div>`).join('')}</div>
  <h2>Top 30</h2><div class="card scroll"><table><tr><th>#</th><th></th><th>Account</th><th class="n">Ads</th><th class="n">Invite</th></tr>
  ${lb.map((u,i) => `<tr><td><span class="rk ${i<3?'r'+(i+1):''}">${i+1}</span></td><td>${av(u)}</td>
  <td>${u.username ? '@'+esc(u.username) : esc(u.name)}</td><td class="n">${u.ads}</td><td class="n">${u.invites}</td></tr>`).join('')}</table></div>`;
  $('#sh').onclick = () => tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(D.link) + '&text=' + encodeURIComponent('Join and win rewards!'));
  $('#cp').onclick = () => { navigator.clipboard.writeText(D.link); notify('Link copied'); };
}

function bars(data, c1, c2) {
  const max = Math.max(1, ...data.map(d => d.c)), w = 300 / data.length, id = 'g' + c1.slice(1);
  return `<svg viewBox="0 0 300 112" width="100%"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
  ${data.map((d,i) => { const h = Math.max(3, d.c / max * 68);
    return `<rect x="${i*w+9}" y="${80-h}" width="${w-18}" height="${h}" rx="5" fill="url(#${id})"/>
    <text x="${i*w+w/2}" y="97" fill="#8b94b8" font-size="10" text-anchor="middle">${d.lbl}</text>
    <text x="${i*w+w/2}" y="${74-h}" fill="#eef1fb" font-size="10" text-anchor="middle">${d.c||''}</text>`; }).join('')}</svg>`;
}

function profile() {
  const m = D.me;
  $('#app').innerHTML = `<div class="card row">${av(m,'av l')}<div class="sp"><b style="font-size:18px">${esc(m.name)}</b>
  <div class="mut">ID ${m.id}</div>
  <div class="row" style="color:var(--gold);font-weight:700;margin-top:4px">${ic('trophy')}Rank ${D.rank}</div></div></div>
  <div class="grid"><div class="card"><div class="mut">Invited</div><div class="big">${m.invites}</div></div>
  <div class="card"><div class="mut">Ads watched</div><div class="big">${m.ads}</div></div></div>
  <h2>This week</h2>
  <div class="card"><div class="mut">Ads per day</div>${bars(D.adsWeek,'#7c5cff','#22d3ee')}</div>
  <div class="card"><div class="mut">Invites per day</div>${bars(D.invWeek,'#34d399','#22d3ee')}</div>
  <h2>People you invited</h2><div class="card">
  ${D.invited.length ? D.invited.map(u => `<div class="row" style="padding:7px 0">${av(u)}<span class="sp">${esc(u.name)}</span>
  <span class="tag ${u.verified?'v':'nv'}">${u.verified?'Verified':'Not verified'}</span></div>`).join('')
  : '<p class="mut">Nobody yet. Share your link from the Invite tab.</p>'}</div>`;
}

async function admin() {
  const a = await api('admin'), s = a.settings;
  $('#app').innerHTML = `<h2>Admin</h2>
  <div class="grid"><div class="card"><div class="mut">Users</div><div class="big">${a.stats.total}</div></div>
  <div class="card"><div class="mut">Verified</div><div class="big">${a.stats.verified}</div></div></div>
  <h2>Rewards</h2><div class="card">
  <input id="r1" placeholder="1st prize" value="${esc(s.reward1)}"><input id="r2" placeholder="2nd prize" value="${esc(s.reward2)}">
  <input id="r3" placeholder="3rd prize" value="${esc(s.reward3)}"><input id="ab" placeholder="Adsgram block ID" value="${esc(s.adsgram_block)}">
  <button class="btn" id="save">${ic('check')}Save changes</button></div>
  <h2>Required channels</h2><div class="card">
  ${a.channels.map(c => `<div class="row" style="padding:6px 0"><span class="sp">${esc(c.title)} <span class="mut">${esc(c.chat_id)}</span></span>
  <button class="btn alt sm" data-del="${c.id}">Remove</button></div>`).join('')}
  <input id="cid" placeholder="@channelusername"><input id="ct" placeholder="Button title"><input id="cu" placeholder="https://t.me/channelusername">
  <button class="btn alt" id="add">${ic('chan')}Add channel</button></div>`;
  $('#save').onclick = async () => { await api('admin/settings','POST',{reward1:$('#r1').value,reward2:$('#r2').value,reward3:$('#r3').value,adsgram_block:$('#ab').value}); notify('Saved'); };
  $('#add').onclick = async () => { await api('admin/channel','POST',{chat_id:$('#cid').value,title:$('#ct').value,url:$('#cu').value}); admin(); };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { await api('admin/channel/'+b.dataset.del,'DELETE'); admin(); });
}

if (!tg || !tg.initData) { onlyTelegram(); }
else { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#0b1020'); tg.setBackgroundColor && tg.setBackgroundColor('#0b1020'); load(); }
</script>
</body>
</html>

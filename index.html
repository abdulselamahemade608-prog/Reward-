<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Rewards</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
:root{--bg:#10141c;--card:#1a212d;--line:#2a3342;--tx:#e9edf3;--mut:#8a95a6;--gold:#f2b84b;--ok:#3ecf8e;--bad:#ff6b6b}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Noto Sans Ethiopic",sans-serif;padding-bottom:84px}
main{padding:16px;max-width:560px;margin:auto}
h2{font-size:18px;margin:18px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:var(--gold);color:#241a00;cursor:pointer}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}.mut{color:var(--mut);font-size:13px}.big{font-size:30px;font-weight:800}
img.av,.av{width:40px;height:40px;border-radius:50%;background:var(--line);object-fit:cover;flex:none}
img.av.l{width:72px;height:72px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:13px;padding:8px 0;border-radius:10px}
nav button.on{color:var(--gold);background:#242d3c}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 4px;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500}
td.n{text-align:right}
input{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px;margin:4px 0 8px;font-size:14px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px}
.tag.v{background:#143a2a;color:var(--ok)}.tag.nv{background:#3d1d1d;color:var(--bad)}
.prize{display:flex;gap:10px;align-items:center;padding:8px 0}
.medal{font-size:22px}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<main id="app"><p class="mut" style="margin-top:40vh;text-align:center">Loading…</p></main>
<nav id="nav" hidden></nav>

<script>
const tg = Telegram.WebApp; tg.ready(); tg.expand();
let D = null, tab = 'ads';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = (p, method = 'GET', body) => fetch('/api/' + p, {
  method, headers: {'x-init': tg.initData, 'content-type': 'application/json'},
  body: body ? JSON.stringify(body) : undefined
}).then(r => r.json());
const av = (u, c = 'av') => u.photo ? `<img class="${c}" src="${esc(u.photo)}" alt="">` : `<div class="${c}"></div>`;

async function load() {
  D = await api('me');
  if (D.error) { $('#app').innerHTML = '<p class="mut" style="margin-top:40vh;text-align:center">Open this app from Telegram.</p>'; return; }
  if (D.missing.length) return gate();
  $('#nav').hidden = false;
  const items = [['ads','📺 Ads'],['invite','👥 Invite'],['profile','👤 Profile']];
  if (D.isAdmin) items.push(['admin','⚙️ Admin']);
  $('#nav').innerHTML = items.map(([k,l]) => `<button data-t="${k}" class="${tab===k?'on':''}">${l}</button>`).join('');
  $('#nav').onclick = e => { const t = e.target.dataset.t; if (t) { tab = t; load(); } };
  ({ads, invite, profile, admin})[tab]();
}

/* ----- channel gate: only shows channels not joined yet ----- */
function gate() {
  $('#nav').hidden = true;
  $('#app').innerHTML = `<h2>Join to continue</h2><p class="mut" style="margin-bottom:12px">Join the channels below, then tap Joined.</p>
  ${D.missing.map(c => `<div class="card row"><b class="sp">${esc(c.title)}</b><button class="btn alt" style="width:auto;padding:8px 16px" onclick="tg.openTelegramLink('${esc(c.url)}')">Join</button></div>`).join('')}
  <button class="btn" onclick="load()">✅ Joined</button>`;
}

/* ----- ads ----- */
function ads() {
  $('#app').innerHTML = `<h2>Watch ads</h2>
  <div class="card"><div class="mut">Ads watched</div><div class="big">${D.me.ads}</div></div>
  <button class="btn" id="w">▶ Watch ad</button><p class="mut" id="msg" style="margin-top:10px"></p>`;
  $('#w').onclick = async () => {
    const b = $('#w'); b.disabled = true;
    try {
      const ctl = window.Adsgram.init({blockId: D.settings.adsgram_block});
      await ctl.show();
      $('#msg').textContent = 'Counting your ad…';
      setTimeout(load, 2500);   // server gets the reward call from Adsgram
    } catch (e) { $('#msg').textContent = 'No ad available right now. Try again soon.'; b.disabled = false; }
  };
}

/* ----- invite + leaderboard ----- */
async function invite() {
  const lb = await api('leaderboard'), s = D.settings;
  const prizes = [['🥇','1st',s.reward1],['🥈','2nd',s.reward2],['🥉','3rd',s.reward3]];
  $('#app').innerHTML = `<h2>Invite friends</h2>
  <div class="card"><div class="mut">Your invites</div><div class="big">${D.me.invites}</div></div>
  <div class="grid"><button class="btn" onclick="tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(D.link)+'&text='+encodeURIComponent('Join and win rewards!'))">Share link</button>
  <button class="btn alt" onclick="navigator.clipboard.writeText(D.link);tg.showAlert('Link copied')">Copy link</button></div>
  <h2>Prizes</h2><div class="card">${prizes.map(p => `<div class="prize"><span class="medal">${p[0]}</span><div><div class="mut">${p[1]} place</div><b>${esc(p[2])}</b></div></div>`).join('')}</div>
  <h2>Top 30</h2><div class="card scroll"><table><tr><th>#</th><th></th><th>Account</th><th class="n">Ads</th><th class="n">Invite</th></tr>
  ${lb.map((u,i) => `<tr><td>${i+1}</td><td>${av(u)}</td><td>${u.username ? '@'+esc(u.username) : esc(u.name)}</td><td class="n">${u.ads}</td><td class="n">${u.invites}</td></tr>`).join('')}</table></div>`;
}

/* ----- profile ----- */
function bars(data, color) {
  const max = Math.max(1, ...data.map(d => d.c)), w = 300 / data.length;
  return `<svg viewBox="0 0 300 110" width="100%">${data.map((d,i) => {
    const h = d.c / max * 70;
    return `<rect x="${i*w+8}" y="${80-h}" width="${w-16}" height="${h}" rx="4" fill="${color}"/>
    <text x="${i*w+w/2}" y="96" fill="#8a95a6" font-size="10" text-anchor="middle">${d.lbl}</text>
    <text x="${i*w+w/2}" y="${74-h}" fill="#e9edf3" font-size="10" text-anchor="middle">${d.c||''}</text>`;
  }).join('')}</svg>`;
}
function profile() {
  const m = D.me;
  $('#app').innerHTML = `<div class="card row">${av(m,'av l')}<div><b style="font-size:18px">${esc(m.name)}</b>
  <div class="mut">ID ${m.id}</div><div style="color:var(--gold);font-weight:700">Rank #${D.rank}</div></div></div>
  <div class="grid"><div class="card"><div class="mut">Invited</div><div class="big">${m.invites}</div></div>
  <div class="card"><div class="mut">Ads watched</div><div class="big">${m.ads}</div></div></div>
  <h2>This week</h2>
  <div class="card"><div class="mut">Ads per day</div>${bars(D.adsWeek,'#f2b84b')}</div>
  <div class="card"><div class="mut">Invites per day</div>${bars(D.invWeek,'#3ecf8e')}</div>
  <h2>People you invited</h2><div class="card">
  ${D.invited.length ? D.invited.map(u => `<div class="row" style="padding:6px 0">${av(u)}<span class="sp">${esc(u.name)}</span>
  <span class="tag ${u.verified?'v':'nv'}">${u.verified?'verified':'not verified'}</span></div>`).join('') : '<p class="mut">Nobody yet. Share your link from the Invite tab.</p>'}</div>`;
}

/* ----- admin ----- */
async function admin() {
  const a = await api('admin'), s = a.settings;
  $('#app').innerHTML = `<h2>Admin</h2>
  <div class="grid"><div class="card"><div class="mut">Users</div><div class="big">${a.stats.total}</div></div>
  <div class="card"><div class="mut">Verified</div><div class="big">${a.stats.verified}</div></div></div>
  <h2>Rewards</h2><div class="card">
  <input id="r1" placeholder="1st prize" value="${esc(s.reward1)}"><input id="r2" placeholder="2nd prize" value="${esc(s.reward2)}">
  <input id="r3" placeholder="3rd prize" value="${esc(s.reward3)}"><input id="ab" placeholder="Adsgram block ID" value="${esc(s.adsgram_block)}">
  <button class="btn" id="save">Save changes</button></div>
  <h2>Required channels</h2><div class="card">
  ${a.channels.map(c => `<div class="row" style="padding:6px 0"><span class="sp">${esc(c.title)} <span class="mut">${esc(c.chat_id)}</span></span>
  <button class="btn alt" style="width:auto;padding:6px 12px" data-del="${c.id}">Remove</button></div>`).join('')}
  <input id="cid" placeholder="@channelusername"><input id="ct" placeholder="Button title"><input id="cu" placeholder="https://t.me/channelusername">
  <button class="btn alt" id="add">Add channel</button></div>`;
  $('#save').onclick = async () => { await api('admin/settings','POST',{reward1:$('#r1').value,reward2:$('#r2').value,reward3:$('#r3').value,adsgram_block:$('#ab').value}); tg.showAlert('Saved'); };
  $('#add').onclick = async () => { await api('admin/channel','POST',{chat_id:$('#cid').value,title:$('#ct').value,url:$('#cu').value}); admin(); };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { await api('admin/channel/'+b.dataset.del,'DELETE'); admin(); });
}

load();
</script>
</body>
</html>
